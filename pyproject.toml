[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "holo-desktop-cli"
version = "1.1.2"
description = "Installs the holo CLI from hai-agents."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "H Company", email = "contact@hcompany.ai" }]
keywords = ["agent", "holo", "desktop-automation", "computer-use", "mcp", "h-company"]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.12",
]
dependencies = ["hai-agents[cli,workstation]>=1.4.3"]

[project.urls]
Documentation = "https://hub.hcompany.ai/agents-api/cli"
Repository = "https://github.com/hcompai/holo-desktop-cli"
SDK = "https://github.com/hcompai/hai-agents-python"
Changelog = "https://github.com/hcompai/holo-desktop-cli/blob/main/CHANGELOG.md"

[project.scripts]
holo = "hai_agents_cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.15.13"]

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.sdist]
include = ["README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
